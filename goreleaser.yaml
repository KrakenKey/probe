version: 2

project_name: krakenkey-probe

before:
  hooks:
    - go mod tidy

builds:
  - id: probe
    main: ./cmd/probe
    binary: krakenkey-probe
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: probe
    format_overrides:
      - goos: linux
        format: tar.gz
      - goos: darwin
        format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: probe
    ids:
      - probe
    package_name: krakenkey-probe
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    vendor: KrakenKey
    homepage: https://krakenkey.io
    maintainer: KrakenKey <security@krakenkey.io>
    description: |-
      TLS monitoring probe for KrakenKey.
      Scans TLS endpoints for certificate expiry, chain validity and
      connection health. Runs standalone (results logged locally) or
      connected (results reported to the KrakenKey dashboard). Ships a
      systemd unit, krakenkey-probe.service.
    license: AGPL-3.0-only
    section: net
    priority: optional
    contents:
      - src: packaging/krakenkey-probe.service
        dst: /usr/lib/systemd/system/krakenkey-probe.service
        file_info:
          mode: 0644
      - dst: /etc/krakenkey
        type: dir
        file_info:
          mode: 0755
      - src: packaging/probe.yaml
        dst: /etc/krakenkey/probe.yaml
        type: config|noreplace
        file_info:
          mode: 0640
          owner: root
          group: krakenkey-probe
      - src: LICENSE
        dst: /usr/share/doc/krakenkey-probe/LICENSE
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/krakenkey-probe/README.md
        file_info:
          mode: 0644
    scripts:
      preinstall: packaging/scripts/preinstall.sh
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh

dockers:
  - image_templates:
      - "ghcr.io/krakenkey/probe:{{ .Version }}-amd64"
      - "ghcr.io/krakenkey/probe:latest-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - probe.example.yaml
    goos: linux
    goarch: amd64
  - image_templates:
      - "ghcr.io/krakenkey/probe:{{ .Version }}-arm64"
      - "ghcr.io/krakenkey/probe:latest-arm64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - probe.example.yaml
    goos: linux
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/krakenkey/probe:{{ .Version }}"
    image_templates:
      - "ghcr.io/krakenkey/probe:{{ .Version }}-amd64"
      - "ghcr.io/krakenkey/probe:{{ .Version }}-arm64"
  - name_template: "ghcr.io/krakenkey/probe:{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "ghcr.io/krakenkey/probe:{{ .Version }}-amd64"
      - "ghcr.io/krakenkey/probe:{{ .Version }}-arm64"
  - name_template: "ghcr.io/krakenkey/probe:{{ .Major }}"
    image_templates:
      - "ghcr.io/krakenkey/probe:{{ .Version }}-amd64"
      - "ghcr.io/krakenkey/probe:{{ .Version }}-arm64"
  - name_template: "ghcr.io/krakenkey/probe:latest"
    image_templates:
      - "ghcr.io/krakenkey/probe:latest-amd64"
      - "ghcr.io/krakenkey/probe:latest-arm64"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
